<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Taller 3D">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Taller 3D · Producción</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { base:"#090d16", card:"#151c2c", cardh:"#1b2338", edge:"#232c42" },
        fontFamily: { sans:["Inter","system-ui","sans-serif"] },
      }},
    };
  </script>
  <style>
    body { background-color:#090d16; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width:0; height:0; }
    @keyframes pulseRed { 0%,100%{ box-shadow:0 0 0 0 rgba(244,63,94,.5);} 50%{ box-shadow:0 0 0 6px rgba(244,63,94,0);} }
    .alerta-roja { animation: pulseRed 1.2s infinite; }
    .fade-out { transition: opacity .4s ease, transform .4s ease; opacity:0; transform: scale(.96); }
    .skeleton { background: linear-gradient(90deg,#151c2c 25%,#1b2338 50%,#151c2c 75%); background-size:200% 100%; animation: sk 1.3s infinite; }
    @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body class="bg-base text-slate-200 font-sans antialiased min-h-screen pb-24 select-none">

<!-- Header -->
<header class="sticky top-0 z-20 bg-card/90 backdrop-blur border-b border-edge">
  <div class="px-4 py-3 flex items-center gap-2" style="padding-top:calc(env(safe-area-inset-top) + .75rem)">
    <span class="text-teal-400 text-xl">🖨️</span>
    <div class="leading-tight">
      <p class="font-bold bg-gradient-to-r from-teal-400 to-cyan-400 bg-clip-text text-transparent">Taller 3D · Producción</p>
      <p class="text-[11px] text-slate-500" id="conexion">Conectando…</p>
    </div>
    <button id="btn-refrescar" onclick="cargarTodo()" title="Refrescar"
            class="ml-auto px-2.5 py-1.5 rounded-lg text-sm bg-base border border-edge text-slate-300 active:bg-cardh">🔄</button>
  </div>
</header>

<!-- ============ SECCIÓN: PEDIDOS ============ -->
<section id="sec-pedidos" class="px-4 pt-4 space-y-4">
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-bold text-slate-100">📦 Pedidos en producción</h1>
    <span id="conteo-pedidos" class="text-xs px-2 py-0.5 rounded-full bg-cardh border border-edge text-slate-400">—</span>
  </div>
  <div id="lista-pedidos" class="space-y-4"></div>
</section>

<!-- ============ SECCIÓN: FILAMENTOS ============ -->
<section id="sec-filamentos" class="hidden px-4 pt-4 space-y-3">
  <h1 class="text-lg font-bold text-slate-100">🧵 Stock de Filamentos</h1>
  <div id="lista-filamentos" class="space-y-3"></div>
</section>

<!-- ============ SECCIÓN: FERIAS (POS móvil) ============ -->
<section id="sec-ferias" class="hidden px-4 pt-4 space-y-4">

  <!-- Vista LISTA de ferias -->
  <div id="ferias-lista-wrap" class="space-y-4">
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-bold text-slate-100">🎪 Ferias y Eventos</h1>
      <button onclick="abrirNuevaFeria()"
              class="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-900 bg-gradient-to-r from-fuchsia-500 to-pink-500 active:opacity-80">＋ Nueva</button>
    </div>
    <div id="lista-ferias" class="space-y-3"></div>
  </div>

  <!-- Vista POS (una feria abierta) -->
  <div id="ferias-pos-wrap" class="hidden space-y-4">
    <!-- Cabecera + caja en tiempo real -->
    <div class="sticky top-[57px] z-10 -mx-4 px-4 py-3 bg-base/95 backdrop-blur border-b border-edge space-y-2">
      <div class="flex items-center gap-2">
        <button onclick="cerrarVistaPOS()" class="px-2 py-1 rounded-lg bg-card border border-edge text-slate-300 active:bg-cardh">←</button>
        <h1 id="pos-nombre" class="font-bold text-slate-100 truncate flex-1">Feria</h1>
        <span id="pos-estado" class="text-[11px] px-2 py-0.5 rounded-md border bg-teal-500/15 text-teal-300 border-teal-500/30">Activa</span>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-card border border-edge rounded-xl py-2">
          <p class="text-[10px] text-slate-500 uppercase tracking-wide">Caja</p>
          <p id="pos-caja" class="font-bold text-teal-300 text-lg leading-tight">Bs. 0</p>
        </div>
        <div class="bg-card border border-edge rounded-xl py-2">
          <p class="text-[10px] text-slate-500 uppercase tracking-wide">Ganancia</p>
          <p id="pos-ganancia" class="font-bold text-emerald-300 text-lg leading-tight">Bs. 0</p>
        </div>
        <div class="bg-card border border-edge rounded-xl py-2">
          <p class="text-[10px] text-slate-500 uppercase tracking-wide">Vendidas</p>
          <p id="pos-vendidas" class="font-bold text-slate-100 text-lg leading-tight">0</p>
        </div>
      </div>
    </div>

    <!-- Botonera POS: un toque = una venta -->
    <div id="pos-productos" class="grid grid-cols-2 gap-3"></div>

    <div class="flex items-center gap-2 pt-1">
      <button onclick="abrirAgregarProducto()"
              class="flex-1 py-3 rounded-xl text-sm font-semibold bg-card border border-edge text-slate-200 active:bg-cardh">＋ Producto</button>
      <button onclick="cerrarFeria()"
              class="flex-1 py-3 rounded-xl text-sm font-semibold text-slate-900 bg-gradient-to-r from-amber-500 to-orange-500 active:opacity-80">🏁 Cerrar caja</button>
    </div>
  </div>
</section>

<!-- ============ MODAL genérico ============ -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center">
  <div class="absolute inset-0 bg-black/60" onclick="cerrarModal()"></div>
  <div class="relative w-full sm:max-w-md bg-card border border-edge rounded-t-2xl sm:rounded-2xl p-4 space-y-3 max-h-[85vh] overflow-y-auto"
       style="padding-bottom:calc(env(safe-area-inset-bottom) + 1rem)">
    <div class="flex items-center justify-between">
      <h3 id="modal-titulo" class="font-bold text-slate-100">Título</h3>
      <button onclick="cerrarModal()" class="text-slate-500 text-xl leading-none px-2">✕</button>
    </div>
    <div id="modal-body" class="space-y-3"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-40 hidden">
  <div class="px-4 py-2 rounded-xl bg-cardh border border-teal-500/40 text-teal-200 text-sm shadow-2xl"></div>
</div>

<!-- ============ TAB BAR INFERIOR ============ -->
<nav class="fixed bottom-0 inset-x-0 z-30 bg-card/95 backdrop-blur border-t border-edge"
     style="padding-bottom: env(safe-area-inset-bottom)">
  <div class="grid grid-cols-3">
    <button id="tab-pedidos" onclick="mostrar('pedidos')" class="py-3 flex flex-col items-center gap-0.5 text-teal-300">
      <span class="text-lg">📦</span><span class="text-[11px] font-medium">Pedidos</span>
    </button>
    <button id="tab-filamentos" onclick="mostrar('filamentos')" class="py-3 flex flex-col items-center gap-0.5 text-slate-500">
      <span class="text-lg">🧵</span><span class="text-[11px] font-medium">Filamentos</span>
    </button>
    <button id="tab-ferias" onclick="mostrar('ferias')" class="py-3 flex flex-col items-center gap-0.5 text-slate-500">
      <span class="text-lg">🎪</span><span class="text-[11px] font-medium">Ferias</span>
    </button>
  </div>
</nav>

<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
