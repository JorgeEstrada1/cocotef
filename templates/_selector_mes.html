{# Selector de mes reutilizable. Requiere 'per' y 'endpoint'. #}
<div class="bg-card border border-edge rounded-xl shadow-lg p-3 mb-6 flex flex-wrap items-center gap-2">
  {% set nav = "px-3 py-2 rounded-lg bg-base border border-edge text-slate-300 hover:bg-cardh hover:text-teal-300 text-sm transition" %}
  <a href="{{ url_for(endpoint, periodo=per.periodo_prev) }}" class="{{ nav }}">← Mes anterior</a>

  <form method="get" action="{{ url_for(endpoint) }}" class="flex items-center gap-2">
    <input type="month" name="periodo" value="{{ per.periodo }}" onchange="this.form.submit()"
           class="bg-base border border-edge rounded-lg px-3 py-2 text-sm text-slate-100
                  focus:border-teal-400 focus:ring-2 focus:ring-teal-500/20 outline-none">
  </form>

  <a href="{{ url_for(endpoint, periodo=per.periodo_next) }}" class="{{ nav }}">Mes siguiente →</a>

  <a href="{{ url_for(endpoint) }}"
     class="px-3 py-2 rounded-lg bg-teal-500/10 text-teal-300 border border-teal-500/30 hover:bg-teal-500/20 text-sm transition">
     Este mes</a>

  <span class="ml-auto text-slate-400 text-sm">
    Mostrando: <b class="text-teal-300">{{ per.periodo_label }}</b>
  </span>
</div>
