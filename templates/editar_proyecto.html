{% extends "base.html" %}
{% block titulo %}Editar proyecto{% endblock %}
{% block contenido %}
<div class="max-w-2xl mx-auto">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold">Editar proyecto</h1>
    <a href="{{ url_for('proyectos') }}" class="text-slate-500 hover:underline text-sm">← Volver</a>
  </div>

  <form method="post" action="{{ url_for('editar_proyecto', pid=p.id) }}"
        class="bg-white rounded-xl shadow p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm text-slate-500">Nombre de la pieza</span>
      <input name="nombre" value="{{ p.nombre }}" required class="w-full border rounded-lg px-3 py-2 mt-1">
    </label>
    <label class="block">
      <span class="text-sm text-slate-500">Cliente</span>
      <input name="cliente" value="{{ p.cliente or '' }}" class="w-full border rounded-lg px-3 py-2 mt-1">
    </label>
    <label class="block">
      <span class="text-sm text-slate-500">Estado</span>
      <select name="estado" class="w-full border rounded-lg px-3 py-2 mt-1">
        {% for e in estados %}<option {{ 'selected' if e == p.estado }}>{{ e }}</option>{% endfor %}
      </select>
    </label>
    <label class="block">
      <span class="text-sm text-slate-500">Peso (g)</span>
      <input name="peso_g" type="number" step="0.1" value="{{ p.peso_g }}"
             class="w-full border rounded-lg px-3 py-2 mt-1">
    </label>
    <label class="block">
      <span class="text-sm text-slate-500">Tiempo estimado (h)</span>
      <input name="tiempo_estimado_h" type="number" step="0.1" value="{{ p.tiempo_estimado_h }}"
             class="w-full border rounded-lg px-3 py-2 mt-1">
    </label>
    <label class="block">
      <span class="text-sm text-slate-500">Filamento</span>
      <select name="filamento_id" class="w-full border rounded-lg px-3 py-2 mt-1">
        <option value="">— Ninguno —</option>
        {% for f in filamentos %}
          <option value="{{ f.id }}" {{ 'selected' if f.id == p.filamento_id }}>{{ f.etiqueta }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="block">
      <span class="text-sm text-slate-500">Asignado a</span>
      <select name="usuario_id" class="w-full border rounded-lg px-3 py-2 mt-1">
        <option value="">— Nadie —</option>
        {% for u in usuarios %}
          <option value="{{ u.id }}" {{ 'selected' if u.id == p.usuario_id }}>{{ u.nombre }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="md:col-span-2 bg-slate-50 rounded-lg p-3 text-sm text-slate-600">
      Costo de filamento actual: <b>{{ p.costo_filamento | money }}</b>
      <span class="text-slate-400">(se recalcula al guardar según peso y filamento)</span>
    </div>
    <div class="md:col-span-2 flex gap-3">
      <button class="bg-indigo-600 text-white rounded-lg px-5 py-2 hover:bg-indigo-500">Guardar cambios</button>
      <a href="{{ url_for('proyectos') }}" class="px-5 py-2 rounded-lg bg-slate-100 hover:bg-slate-200">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
