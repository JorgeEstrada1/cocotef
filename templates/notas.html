{% extends "base.html" %}
{% block content %}
<h2>Notas rápidas</h2>
<div class="row mb-4">
    <div class="col-md-8">
        <form method="POST" action="{{ url_for('nota_nueva') }}" class="input-group">
            <input type="text" name="texto" class="form-control" placeholder="Escribí una nota..." required>
            <button type="submit" class="btn btn-primary">+ Agregar</button>
        </form>
    </div>
</div>
<div class="row">
    {% for n in notas %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <p class="card-text">{{ n.texto }}</p>
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-muted">
                        {{ n.usuario.nombre if n.usuario else '?' }} · {{ n.created_at.strftime('%d/%m %H:%M') }}
                    </small>
                    <form action="{{ url_for('nota_eliminar', id=n.id) }}" method="POST" class="d-inline">
                        <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12"><p class="text-muted">Sin notas aún</p></div>
    {% endfor %}
</div>
{% endblock %}
