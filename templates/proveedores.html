{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Proveedores</h2>
    <a href="{{ url_for('proveedor_nuevo') }}" class="btn btn-primary">+ Agregar</a>
</div>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr><th>Nombre</th><th>Contacto</th><th>Teléfono</th><th>Email</th><th>Notas</th><th></th></tr>
        </thead>
        <tbody>
            {% for p in proveedores %}
            <tr>
                <td><strong>{{ p.nombre }}</strong></td>
                <td>{{ p.contacto or '-' }}</td>
                <td>{{ p.telefono or '-' }}</td>
                <td>{{ p.email or '-' }}</td>
                <td>{{ p.notas or '-' }}</td>
                <td>
                    <a href="{{ url_for('proveedor_editar', id=p.id) }}" class="btn btn-sm btn-outline-primary">✏️</a>
                    <form action="{{ url_for('proveedor_eliminar', id=p.id) }}" method="POST" class="d-inline" onsubmit="return confirm('¿Eliminar?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="6" class="text-center text-muted">Sin proveedores</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
